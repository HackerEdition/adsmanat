<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİLET-COİN - ADSMANAT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="biletcoin.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Header -->
    <header id="header" class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">💎</div>
                <span class="logo-text">ADSMANAT</span>
                <div class="coin-icons">🪙💰</div>
            </div>
            <button class="menu-btn" id="menuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Slide Menu -->
    <div class="slide-menu" id="slideMenu">
        <div class="menu-header">
            <div class="menu-logo">
                <div class="logo-icon">💎</div>
                <span>ADSMANAT</span>
            </div>
            <button class="close-btn" id="closeBtn">✕</button>
        </div>
        <nav class="menu-nav">
            <a href="index.html" class="menu-item">
                <span class="menu-icon">🎯</span>
                <span>QAZANC</span>
            </a>
            <a href="friends.html" class="menu-item">
                <span class="menu-icon">👥</span>
                <span>DOSTLAR</span>
            </a>
            <a href="rules.html" class="menu-item">
                <span class="menu-icon">📜</span>
                <span>QAYDALAR</span>
            </a>
            <a href="settings.html" class="menu-item">
                <span class="menu-icon">⚙️</span>
                <span>AYARLAR</span>
            </a>
        </nav>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Win Message -->
    <div class="win-message" id="winMessage">
        <span class="win-icon">🎉</span>
        <span class="win-text" id="winText">Siz 1 ADSCOİN qazandınız!</span>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Title Section -->
        <div class="title-card">
            <h2>BİLETLƏRİ ADSCOİN-Ə ÇEVİRİN</h2>
        </div>

        <!-- Balance Section -->
        <div class="balance-card">
            <h3>BALANS</h3>
            <div class="balance-items">
                <div class="balance-item">
                    <span class="balance-label">BİLET</span>
                    <span class="balance-value" id="ticketBalance">0</span>
                </div>
                <div class="balance-item">
                    <span class="balance-label">ADSCOİN</span>
                    <span class="balance-value" id="adscoinBalance">0</span>
                </div>
                <div class="balance-item">
                    <span class="balance-label">AZN</span>
                    <span class="balance-value" id="aznBalance">0.00</span>
                </div>
            </div>
        </div>

        <!-- Spin Wheel Section -->
        <div class="wheel-container">
            <div class="wheel-wrapper">
                <div class="wheel" id="wheel">
                    <div class="wheel-segment" data-value="1">1</div>
                    <div class="wheel-segment" data-value="2">2</div>
                    <div class="wheel-segment" data-value="3">3</div>
                    <div class="wheel-segment" data-value="4">4</div>
                    <div class="wheel-segment" data-value="5">5</div>
                    <div class="wheel-segment" data-value="0">0</div>
                    <div class="wheel-segment" data-value="1">1</div>
                    <div class="wheel-segment" data-value="2">2</div>
                </div>
                <div class="wheel-pointer"></div>
            </div>
            
            <div class="wheel-labels">
                <div class="wheel-label">ADSCOİN</div>
            </div>
            
            <button class="spin-btn" id="spinBtn">ÇEVİR</button>
        </div>
    </main>

    <!-- Tabs -->
    <div class="tabs-container" id="tabsContainer">
        <div class="tabs">
            <a href="index.html" class="tab">
                <div class="tab-icon">🎫</div>
                <span>BİLET QAZAN</span>
            </a>
            <a href="biletcoin.html" class="tab active">
                <div class="tab-icon">🎡</div>
                <span>BİLET-COİN</span>
            </a>
            <a href="events.html" class="tab">
                <div class="tab-icon">🎉</div>
                <span>HADİSƏLƏR</span>
            </a>
            <a href="tasks.html" class="tab">
                <div class="tab-icon">✅</div>
                <span>GÖREVLƏR</span>
            </a>
            <a href="withdraw.html" class="tab">
                <div class="tab-icon">💰</div>
                <span>ÇIXARIŞ</span>
            </a>
        </div>
    </div>

    <!-- Bubbles Animation -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <script src="script.js"></script>
    <script src="biletcoin.js"></script>
</body>
</html>
