<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADSMANAT - Qazanc</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">💎</div>
                <span class="logo-text">ADSMANAT</span>
                <div class="coin-icons">
                    <span class="coin">🪙</span>
                    <span class="coin">💰</span>
                </div>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Slide Menu -->
    <div class="slide-menu" id="slideMenu">
        <div class="slide-menu-header">
            <div class="slide-menu-logo">
                <div class="logo-icon">💎</div>
                <span class="logo-text">ADSMANAT</span>
            </div>
            <button class="close-menu" id="closeMenu">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="slide-menu-content">
            <div class="menu-item active" data-page="index">
                <i class="fas fa-coins"></i>
                <span>QAZANC</span>
            </div>
            <div class="menu-item" data-page="friends">
                <i class="fas fa-users"></i>
                <span>DOSTLAR</span>
            </div>
            <div class="menu-item" data-page="rules">
                <i class="fas fa-book"></i>
                <span>QAYDALAR</span>
            </div>
            <div class="menu-item" data-page="settings">
                <i class="fas fa-cog"></i>
                <span>AYARLAR</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- User Profile Section -->
        <div class="profile-section">
            <div class="profile-card">
                <div class="profile-info">
                    <div class="profile-avatar" id="profileAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-details">
                        <h3 id="userName">İstifadəçi</h3>
                        <p id="userUsername">@username</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="balance-section">
            <div class="balance-card">
                <h3>BALANS</h3>
                <div class="balance-items">
                    <div class="balance-item">
                        <span class="balance-label">BİLET</span>
                        <span class="balance-value" id="biletBalance">0</span>
                    </div>
                    <div class="balance-item">
                        <span class="balance-label">ADSCOİN</span>
                        <span class="balance-value" id="adscoinBalance">0</span>
                    </div>
                    <div class="balance-item">
                        <span class="balance-label">AZN</span>
                        <span class="balance-value" id="aznBalance">0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad Watch Section -->
        <div class="ad-watch-section">
            <div class="ad-watch-card">
                <div class="ad-watch-header">
                    <i class="fas fa-play-circle"></i>
                    <h3>REKLAM İZLƏ</h3>
                </div>
                <div class="ad-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="adProgress"></div>
                    </div>
                    <div class="progress-text">
                        <span id="adCount">0</span>/20 reklam
                    </div>
                </div>
                <button class="watch-ad-btn" id="watchAdBtn" disabled>
                    <i class="fas fa-play"></i>
                    REKLAM İZLƏ
                </button>
            </div>
        </div>

        <!-- Confirmation Message -->
        <div class="confirmation-message" id="confirmationMessage">
            <i class="fas fa-check-circle"></i>
            <span>Təsdiqləndi!</span>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs-container">
            <div class="tab active" data-page="index">
                <i class="fas fa-ticket-alt"></i>
                <span>BİLET QAZAN</span>
            </div>
            <div class="tab" data-page="biletcoin">
                <i class="fas fa-exchange-alt"></i>
                <span>BİLET-COİN</span>
            </div>
            <div class="tab" data-page="events">
                <i class="fas fa-calendar-star"></i>
                <span>HADİSƏLƏR</span>
            </div>
            <div class="tab" data-page="tasks">
                <i class="fas fa-tasks"></i>
                <span>GÖREVLƏR</span>
            </div>
            <div class="tab" data-page="withdraw">
                <i class="fas fa-money-bill-wave"></i>
                <span>ÇIXARIŞ</span>
            </div>
        </div>
    </main>

    <!-- Background Bubbles -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
