<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verification | ADSMAnat</title>
    <style>
        body{ margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#eaf2ff; background: radial-gradient(60% 80% at 20% 10%, #1b1f2a 0%, #0f0f13 65%); }
        .wrap{ max-width:520px; margin:0 auto; padding:20px; }
        .card{ background:#12141a; border:1px solid #243045; border-radius:16px; padding:18px; box-shadow:0 0 0 2px #00c2ff22 inset; }
        .title{ font-weight:800; margin:8px 0 12px; text-align:center; }
        .code{ display:grid; place-items:center; font-size:28px; letter-spacing:4px; font-weight:800; padding:16px; border-radius:12px; background:#0f131b; border:1px dashed #2a3a52; }
        .hint{ color:#a8bed7; text-align:center; margin-top:8px; }
        .btns{ display:flex; gap:10px; margin-top:16px; }
        .btn{ flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2a3a52; background:#0f131b; color:#eaf2ff; }
        .btn-primary{ background: linear-gradient(135deg, #00c2ff 0%, #0077ff 100%); border:0; color:white; box-shadow:0 6px 18px #0080ff44; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="title">Kodunuzu bu səhifədən götürün</div>
            <div class="code" id="code">••••••••</div>
            <div class="hint">Bu kodu əvvəlki pəncərədə açıq qalan «Görevlər» səhifəsinə yazın.</div>
            <div class="btns">
                <button class="btn" onclick="window.close()">Bağla</button>
                <a id="back" class="btn btn-primary" href="tasks.html">Görevlərə Qayıt</a>
            </div>
        </div>
    </div>

    <script>
        const API_CREATE = 'api_create_code.php';
        // This page may be opened from short link without code param. If so, generate here.
        const p = new URLSearchParams(location.search);
        const initialCode = p.get('code');
        const task = p.get('task') || 'sl1';
        const codeEl = document.getElementById('code');
        const back = document.getElementById('back');
        back.href = 'tasks.html#' + encodeURIComponent(task);

        async function ensureCode(){
            if(initialCode){ codeEl.textContent = initialCode; return; }
            try{
                const res = await fetch(API_CREATE, { method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ task_key: task }) });
                const data = await res.json();
                if(data && data.code){
                    codeEl.textContent = data.code;
                    try{ sessionStorage.setItem('code_meta_' + task, JSON.stringify(data)); localStorage.setItem('entry_open_' + task, '1'); }catch(e){}
                } else {
                    codeEl.textContent = 'Xəta';
                }
            }catch(e){ codeEl.textContent = 'Xəta'; }
        }
        ensureCode();
    </script>
</body>
</html>
