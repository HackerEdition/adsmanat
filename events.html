<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADSMANAT - Hadisələr</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">💎</div>
                <span class="logo-text">ADSMANAT</span>
                <div class="coin-icons">
                    <span class="coin">🪙</span>
                    <span class="coin">💰</span>
                </div>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Slide Menu -->
    <div class="slide-menu" id="slideMenu">
        <div class="slide-menu-header">
            <div class="slide-menu-logo">
                <div class="logo-icon">💎</div>
                <span class="logo-text">ADSMANAT</span>
            </div>
            <button class="close-menu" id="closeMenu">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="slide-menu-content">
            <div class="menu-item" data-page="index">
                <i class="fas fa-coins"></i>
                <span>QAZANC</span>
            </div>
            <div class="menu-item" data-page="friends">
                <i class="fas fa-users"></i>
                <span>DOSTLAR</span>
            </div>
            <div class="menu-item" data-page="rules">
                <i class="fas fa-book"></i>
                <span>QAYDALAR</span>
            </div>
            <div class="menu-item" data-page="settings">
                <i class="fas fa-cog"></i>
                <span>AYARLAR</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Events Section -->
        <div class="events-section">
            <div class="events-card">
                <h3>HADİSƏLƏR</h3>
                <div class="event-item">
                    <div class="event-header">
                        <h4>BOTUN İLK HƏFTƏSİ</h4>
                    </div>
                    <div class="event-content">
                        <p class="event-description">
                            Qaydalar hissəsində qaydaları tanış ola bilərsiniz
                        </p>
                        <div class="event-reward">
                            <i class="fas fa-gift"></i>
                            <span>QAZANC: 50 ADSCOİN</span>
                        </div>
                        <button class="join-event-btn" id="joinEventBtn">
                            <i class="fas fa-plus"></i>
                            QOŞUL
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs-container">
            <div class="tab" data-page="index">
                <i class="fas fa-ticket-alt"></i>
                <span>BİLET QAZAN</span>
            </div>
            <div class="tab" data-page="biletcoin">
                <i class="fas fa-exchange-alt"></i>
                <span>BİLET-COİN</span>
            </div>
            <div class="tab active" data-page="events">
                <i class="fas fa-calendar-star"></i>
                <span>HADİSƏLƏR</span>
            </div>
            <div class="tab" data-page="tasks">
                <i class="fas fa-tasks"></i>
                <span>GÖREVLƏR</span>
            </div>
            <div class="tab" data-page="withdraw">
                <i class="fas fa-money-bill-wave"></i>
                <span>ÇIXARIŞ</span>
            </div>
        </div>
    </main>

    <!-- Background Bubbles -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <script src="script.js"></script>
    <script src="events.js"></script>
</body>
</html>
